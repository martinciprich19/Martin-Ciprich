plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

if (project.hasProperty('rivaBuildRoot')) {
    layout.buildDirectory = file("${project.property('rivaBuildRoot')}/app")
}

android {
    namespace 'sk.rivapadel.apptest'
    compileSdk 35

    defaultConfig {
        applicationId 'sk.rivapadel.apptest'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '1.10'
    }

    signingConfigs {
        debug {
            def localAppData = System.getenv('LOCALAPPDATA')
            if (localAppData) {
                storeFile file("${localAppData}/RivaAndroidTools/diagnostic-debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
            manifest.srcFile '../AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}
